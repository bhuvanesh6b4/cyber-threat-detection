<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports · AI Cyber Threat Detection System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">🛡️</div>
        <div class="sidebar-brand-text">
            <div class="brand">CyberSentinel AI</div>
            <div class="subtitle">Threat Detection System</div>
        </div>
    </div>
    <nav class="sidebar-nav">
        <a class="nav-link" data-page="index.html" href="index.html"><span class="ico">▦</span>Dashboard</a>
        <a class="nav-link" data-page="scanner.html" href="scanner.html"><span class="ico">⌕</span>Scanner</a>
        <a class="nav-link" data-page="monitor.html" href="monitor.html"><span class="ico">📡</span>Monitor</a>
        <a class="nav-link" data-page="reports.html" href="reports.html"><span class="ico">▤</span>Reports</a>
        <a class="nav-link" data-page="settings.html" href="settings.html"><span class="ico">⚙</span>Settings</a>
    </nav>
    <div class="sidebar-footer">
        <a class="btn-scan" href="scanner.html" style="display:block; text-align:center;">▷ New Scan</a>
    </div>
</aside>

<div class="main-container">
    <header class="topbar">
        <div class="status-pill" id="status-pill"><span class="status-dot" id="status-dot"></span><span id="status-label">Checking backend...</span></div>
        <div style="flex:1"></div>
        <div class="header-actions">
            <button class="icon-btn">🔔</button>
            <div class="avatar">AD</div>
        </div>
    </header>

    <div class="page-canvas">
        <div class="page-header">
            <div>
                <h1>Scan Reports</h1>
                <p>Every row is a real record pulled from GET /api/reports (Google Sheets).</p>
            </div>
        </div>

        <div class="filters-bar">
            <input type="text" id="reports-search" placeholder="Search scan ID, input, threat type...">
            <select id="reports-status-filter">
                <option value="ALL">All Statuses</option>
                <option value="SAFE">Safe</option>
                <option value="SUSPICIOUS">Suspicious</option>
                <option value="MALICIOUS">Malicious</option>
            </select>
        </div>

        <div class="card">
            <div class="card-body no-pad">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Scan ID</th><th>Date</th><th>Type</th><th>Input</th><th>Status</th>
                                <th>Score</th><th>Threat Type</th><th>Confidence</th><th>Source</th>
                            </tr>
                        </thead>
                        <tbody id="reports-body">
                            <tr class="empty-row"><td colspan="9"><span class="loading-text"><span class="spinner"></span>Loading reports...</span></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-header" style="justify-content:space-between;">
                <span id="reports-page-info" style="font-size:12px; color:var(--text-secondary);">—</span>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-outline" id="reports-prev">← Prev</button>
                    <button class="btn btn-outline" id="reports-next">Next →</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
